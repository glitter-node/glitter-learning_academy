<layout name="auth/reset_password" version="1.0.0" extends="_user_base">
  <meta title="$t:glitter-learning-academy.auth.reset_title" :auth_required="false"/><init-local><field name="form"><field name="email" value="{{query.email ?? ''}}"/><field name="token" value="{{query.token ?? ''}}"/><field name="password" value=""/><field name="password_confirmation" value=""/></field></init-local>
  <slot name="content"><div class="glitter-learning-academy-container"><form class="glitter-learning-academy-form" data-key="form"><on type="submit"><api-call target="/api/auth/reset-password" method="POST"><body email="{{form.email}}" token="{{form.token}}" password="{{form.password}}" password_confirmation="{{form.password_confirmation}}"/><success><toast type="success" message="$t:glitter-learning-academy.auth.reset_done"/><navigate path="/login"/></success><fail><toast type="error" message="{{error.message ?? '$t:glitter-learning-academy.common.request_failed'}}"/></fail></api-call></on><h1>$t:glitter-learning-academy.auth.reset_title</h1><p class="glitter-learning-academy-muted">$t:glitter-learning-academy.auth.reset_description</p><div class="glitter-learning-academy-field"><label for="reset-email">$t:glitter-learning-academy.auth.email</label><input id="reset-email" type="email" name="email" required="required" class="glitter-learning-academy-input"/></div><div class="glitter-learning-academy-field"><label for="reset-token">$t:glitter-learning-academy.auth.token</label><input id="reset-token" type="text" name="token" required="required" class="glitter-learning-academy-input"/></div><div class="glitter-learning-academy-field"><label for="reset-password">$t:glitter-learning-academy.auth.password</label><input id="reset-password" type="password" name="password" required="required" autocomplete="new-password" class="glitter-learning-academy-input"/></div><div class="glitter-learning-academy-field"><label for="reset-confirmation">$t:glitter-learning-academy.auth.password_confirmation</label><input id="reset-confirmation" type="password" name="password_confirmation" required="required" autocomplete="new-password" class="glitter-learning-academy-input"/></div><button type="submit" class="glitter-learning-academy-button">$t:glitter-learning-academy.auth.reset</button></form></div></slot>
</layout>
