<layout name="auth/forgot_password" version="1.0.0" extends="_user_base">
  <meta title="$t:glitter-learning-academy.auth.forgot_title" :auth_required="false"/><init-local><field name="form"><field name="email" value=""/></field></init-local>
  <slot name="content"><div class="glitter-learning-academy-container"><form class="glitter-learning-academy-form" data-key="form"><on type="submit"><api-call target="/api/auth/forgot-password" method="POST"><body email="{{form.email}}"/><success><toast type="success" message="$t:glitter-learning-academy.auth.sent"/></success><fail><toast type="error" message="{{error.message ?? '$t:glitter-learning-academy.common.request_failed'}}"/></fail></api-call></on><h1>$t:glitter-learning-academy.auth.forgot_title</h1><p class="glitter-learning-academy-muted">$t:glitter-learning-academy.auth.forgot_description</p><div class="glitter-learning-academy-field"><label for="forgot-email">$t:glitter-learning-academy.auth.email</label><input id="forgot-email" type="email" name="email" required="required" autocomplete="email" class="glitter-learning-academy-input"/></div><button type="submit" class="glitter-learning-academy-button">$t:glitter-learning-academy.auth.send</button></form></div></slot>
</layout>
