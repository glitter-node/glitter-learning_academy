<layout name="auth/login" version="1.0.0" extends="_user_base">
  <meta title="$t:glitter-learning-academy.auth.login" :auth_required="false"/>
  <init-local><field name="form"><field name="email" value=""/><field name="password" value=""/></field><field name="error" :value="null"/></init-local>
  <slot name="content"><div class="glitter-learning-academy-container"><form class="glitter-learning-academy-form" data-key="form">
    <on type="submit"><login target="user"><success><navigate if="{{!response.two_factor_required &amp;&amp; !response.password_change_required}}" path="{{query.redirect}}" fallbackPath="/learning/me"/></success><fail><set-state target="local" error="{{error.message ?? '$t:glitter-learning-academy.common.request_failed'}}"/></fail><body email="{{form.email}}" password="{{form.password}}"/></login></on>
    <h1>$t:glitter-learning-academy.auth.login</h1><p class="glitter-learning-academy-muted">$t:glitter-learning-academy.auth.login_description</p><p data-if="{{_local.error}}">{{_local.error}}</p>
    <div class="glitter-learning-academy-field"><label for="academy-email">$t:glitter-learning-academy.auth.email</label><input id="academy-email" type="email" name="email" required="required" autocomplete="email" class="glitter-learning-academy-input"/></div>
    <div class="glitter-learning-academy-field"><label for="academy-password">$t:glitter-learning-academy.auth.password</label><input id="academy-password" type="password" name="password" required="required" autocomplete="current-password" class="glitter-learning-academy-input"/></div>
    <div class="glitter-learning-academy-actions glitter-learning-academy-login-actions"><a href="/forgot-password">$t:glitter-learning-academy.auth.forgot_link</a><button type="submit" class="glitter-learning-academy-button">$t:glitter-learning-academy.auth.login</button></div>
  </form></div></slot>
</layout>
